name: Testes

on:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # O APK final sai sem assinatura aqui (a chave fica só no Mac do dono), mas o build do release,
      # com o R8, é conferido a cada push
      - run: ./gradlew test assembleDebug lintDebug assembleRelease
